<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — GENOS DEV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="nav">
  <a href="/" class="logo">
    <span class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </span>
    <span class="logo-text">GENOS<span class="accent">DEV</span></span>
  </a>
  <div class="nav-actions">
    <a href="/" class="btn btn-sm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>Home</span>
    </a>
    <button class="btn btn-red btn-sm" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Logout</span>
    </button>
  </div>
</header>

<main class="container">

  <section class="hero hero-admin">
    <h1>CONTROL PANEL</h1>
    <p>Buat, edit, dan kelola script yang kamu share ke publik.</p>
  </section>

  <div class="admin-grid">

    <!-- FORM CREATE / EDIT -->
    <section class="panel">
      <div class="panel-head">
        <h2 id="formTitle">BUAT SCRIPT BARU</h2>
        <button class="btn btn-sm hidden" id="cancelEditBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span>Batal</span>
        </button>
      </div>

      <div class="alert hidden" id="formAlert"></div>

      <div class="form-row">
        <div class="form-group">
          <label for="titleInput">Judul Script</label>
          <input type="text" class="input" id="titleInput" placeholder="Contoh: Scraper Marketplace" />
        </div>
        <div class="form-group">
          <label for="filenameInput">Nama File</label>
          <input type="text" class="input" id="filenameInput" placeholder="scraper.js" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="langSelect">Bahasa</label>
          <select class="input" id="langSelect">
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="python">Python</option>
            <option value="php">PHP</option>
            <option value="bash">Bash</option>
            <option value="json">JSON</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="sql">SQL</option>
            <option value="go">Go</option>
            <option value="java">Java</option>
            <option value="cpp">C++</option>
            <option value="text">Plain Text</option>
          </select>
        </div>
        <div class="form-group">
          <label>Upload File</label>
          <label class="file-upload" for="fileInput">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span id="fileLabel">Pilih file...</span>
          </label>
          <input type="file" id="fileInput" class="hidden" />
        </div>
      </div>

      <div class="form-group">
        <label for="descInput">Deskripsi</label>
        <textarea class="input textarea-sm" id="descInput" placeholder="Deskripsi singkat tentang script ini..." rows="3"></textarea>
      </div>

      <div class="form-group">
        <label for="contentInput">Kode</label>
        <textarea class="input textarea-code" id="contentInput" placeholder="// Tempel kode di sini atau upload file..." spellcheck="false"></textarea>
      </div>

      <button class="btn btn-dark btn-full" id="submitBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span id="submitLabel">Publish Script</span>
      </button>
    </section>

    <!-- LIST MANAGER -->
    <section class="panel">
      <div class="panel-head">
        <h2>KELOLA SCRIPT</h2>
        <span class="count-badge" id="countBadge">0</span>
      </div>
      <div id="pasteList" class="paste-list"></div>
    </section>

  </div>
</main>

<footer class="footer">
  <p>&copy; <span id="year"></span> GENOS DEV — Admin</p>
</footer>

<script src="admin.js"></script>
</body>
</html>
